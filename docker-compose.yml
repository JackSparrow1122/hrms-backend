services:
  postgres:
    image: postgres:16-alpine
    container_name: ga-hrms-postgres
    restart: always
    environment:
      POSTGRES_DB: ga_hrms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ga_hrms"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ga-hrms-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gahrms.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
